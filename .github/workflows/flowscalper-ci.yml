# PAPER 전용 앱의 저장소 위생과 결정적 검증을 실행한다.
name: flowscalper-ci
on:
  push:
    paths:
      - "ROBOM_FlowScalper_Codex_Package_20260822/**"
      - ".github/workflows/flowscalper-ci.yml"
  pull_request:
    paths:
      - "ROBOM_FlowScalper_Codex_Package_20260822/**"
      - ".github/workflows/flowscalper-ci.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ROBOM_FlowScalper_Codex_Package_20260822
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ROBOM_FlowScalper_Codex_Package_20260822/frontend/pnpm-lock.yaml
      - run: uv sync --all-groups --locked
      - run: pnpm install --frozen-lockfile
        working-directory: ROBOM_FlowScalper_Codex_Package_20260822/frontend
      - run: make repo-hygiene
      - run: make lint typecheck test build
  browser:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ROBOM_FlowScalper_Codex_Package_20260822
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ROBOM_FlowScalper_Codex_Package_20260822/frontend/pnpm-lock.yaml
      - run: uv sync --all-groups --locked
      - run: pnpm install --frozen-lockfile
        working-directory: ROBOM_FlowScalper_Codex_Package_20260822/frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ROBOM_FlowScalper_Codex_Package_20260822/frontend
      - run: ROBOM_E2E_CAPTURE=1 make e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flowscalper-browser-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            ROBOM_FlowScalper_Codex_Package_20260822/evidence/screenshots/phase02-*.png
            ROBOM_FlowScalper_Codex_Package_20260822/frontend/test-results/
