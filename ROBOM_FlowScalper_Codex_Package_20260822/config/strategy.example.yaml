strategy:
  common:
    warmup_minutes: 30
    candidate_confirmation_ms: 500
    confirmation_range_ms: [300, 1000]
    noise_buffer:
      minimum_ticks: 2
      spread_multiplier: 1.5
      micro_noise_quantile: 0.80
      include_exit_slippage_buffer: true
    edge_decay_persistence_ms: 800
    emergency_stale_absolute_seconds: 900
    no_fixed_120_second_exit: true

  liquidity_sweep_absorption:
    enabled: true
    strategy_id: LSA_REVERSAL_V1
    permitted_regimes: [RANGE, TREND_UP, TREND_DOWN]
    structural_lookback_minutes: [5, 15, 30]
    sweep_extension_noise_units: [0.5, 2.5]
    aggressive_flow_robust_z_min: 1.8
    price_response_efficiency_max_quantile: 0.30
    refill_window_ms: [500, 3000]
    require_ofi_flip: true
    require_microprice_reclaim: true
    require_range_reentry: true
    minimum_structural_risk_fraction: 0.0080

  compression_breakout_reacceleration:
    enabled: true
    strategy_id: CBR_CONTINUATION_V1
    permitted_regimes: [TREND_UP, TREND_DOWN]
    compression_windows_seconds: [30, 60, 120]
    compression_quantile_max: 0.20
    pullback_wait_seconds: [1, 10]
    pullback_retrace_fraction: [0.20, 0.60]
    aggressive_flow_robust_z_min: 1.5
    require_counterflow_price_impact_failure: true
    require_ofi_reacceleration: true
    require_microprice_alignment: true
    minimum_structural_risk_fraction: 0.0030

  vwap_exhaustion_reversion:
    enabled: true
    strategy_id: VWAP_EXHAUSTION_REVERSION_V1
    stability: EXPERIMENTAL
    default_mode: SHADOW
    permitted_regimes: [RANGE]
    vwap_deviation_robust_z_min: 2.0
    aggressive_flow_robust_z_min: 1.5
    require_price_progress_stall: true
    require_opposite_depth_refill: true
    require_ofi_and_microprice_reversal: true
    minimum_structural_risk_fraction: 0.0080

  ofi_continuation_pullback:
    enabled: true
    strategy_id: OFI_CONTINUATION_PULLBACK_V1
    stability: EXPERIMENTAL
    default_mode: SHADOW
    permitted_regimes: [TREND_UP, TREND_DOWN]
    price_efficiency_percentile_min: 0.50
    pullback_seconds: [1, 15]
    pullback_retrace_fraction: [0.10, 0.60]
    require_multi_window_ofi_alignment: true
    require_original_flow_reacceleration: true
    minimum_structural_risk_fraction: 0.0030

  queue_microprice_momentum:
    enabled: true
    strategy_id: QUEUE_MICROPRICE_MOMENTUM_V1
    stability: EXPERIMENTAL
    default_mode: SHADOW
    permitted_regimes: [RANGE, TREND_UP, TREND_DOWN]
    spread_bps_max: 8.0
    top5_imbalance_min: 0.18
    top10_imbalance_min: 0.12
    require_250ms_and_3s_ofi_alignment: true
    trade_imbalance_1s_min: 0.15
    microprice_displacement_bps_min: 0.25
    confirmation_ms: 500
    minimum_structural_risk_fraction: 0.0030

  aggressor_flow_continuation:
    enabled: true
    strategy_id: AGGRESSOR_FLOW_CONTINUATION_V1
    stability: EXPERIMENTAL
    default_mode: SHADOW
    permitted_regimes: [TREND_UP, TREND_DOWN]
    spread_bps_max: 10.0
    aggressive_signed_notional_robust_z_min: 1.8
    trade_imbalance_3s_min: 0.25
    trade_imbalance_10s_min: 0.10
    price_response_efficiency_min: 0.55
    require_ofi_and_microprice_alignment: true
    confirmation_ms: 500
    minimum_structural_risk_fraction: 0.0030

  registry:
    modes: [ACTIVE, SHADOW, OFF]
    default_directions: [LONG, SHORT]
    shadow_profiles: [BASE, STRESS]
    minimum_final_net_reward_risk: 1.20
    minimum_expected_round_trip_cost_bps: 13
